<div class="auth-page">
  <div>
    <div class="auth-brand">
      <div class="mark">GF</div>
      <h1 class="brand-gradient-text">The Good Fellas</h1>
    </div>

    <form class="auth-card" (ngSubmit)="submit()">
      <h1>Sign in</h1>
      <p class="subtitle">Welcome back — sign in to your portal</p>

      @if (error()) {
        <div class="error">{{ error() }}</div>
      }

      <label>
        Email
        <input type="email" name="email" [(ngModel)]="email" required autocomplete="email" />
      </label>

      <label>
        Password
        <input type="password" name="password" [(ngModel)]="password" required autocomplete="current-password" />
      </label>

      <button type="submit" [disabled]="loading()">{{ loading() ? 'Signing in...' : 'Sign in' }}</button>

      <p class="switch">New client? <a routerLink="/register">Create an account</a></p>
    </form>
  </div>
</div>
