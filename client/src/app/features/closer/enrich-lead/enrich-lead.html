<div class="page">
  <h1>Complete Lead</h1>

  @if (loading()) {
    <p class="empty">Loading...</p>
  } @else {
    <form (ngSubmit)="submit()">
      @if (error()) {
        <div class="error">{{ error() }}</div>
      }

      <div class="card">
        <h2 style="font-size:0.95rem; margin:0 0 0.75rem;">Personal & Contact</h2>
        <div class="form-grid">
          <label>Customer's Name<input type="text" name="customerName" [(ngModel)]="form.customerName" required /></label>
          <label>Marital Status<input type="text" name="maritalStatus" [(ngModel)]="form.maritalStatus" /></label>
          <label>Phone Number<input type="tel" name="phone" [(ngModel)]="form.phone" required /></label>
          <label>Mailing Address<input type="text" name="mailingAddress" [(ngModel)]="form.mailingAddress" /></label>
          <label>State<input type="text" name="state" [(ngModel)]="form.state" required /></label>
          <label>Zipcode<input type="text" name="zipcode" [(ngModel)]="form.zipcode" /></label>
          <label>Email Address (optional)<input type="email" name="email" [(ngModel)]="form.email" /></label>
          <label>Birth State<input type="text" name="birthState" [(ngModel)]="form.birthState" /></label>
          <label>Yearly Income<input type="number" name="yearlyIncome" [(ngModel)]="form.yearlyIncome" min="0" /></label>
          <label>
            Smoker
            <select name="smoker" [(ngModel)]="form.smoker">
              <option [ngValue]="undefined" disabled selected>Select</option>
              <option [ngValue]="true">Yes</option>
              <option [ngValue]="false">No</option>
            </select>
          </label>
          <label>DOB<input type="date" name="dob" [(ngModel)]="form.dob" /></label>
          <label>Age<input type="number" name="age" [(ngModel)]="form.age" min="0" /></label>
          <label>Height<input type="text" name="height" [(ngModel)]="form.height" /></label>
          <label>Weight (lbs)<input type="number" name="weight" [(ngModel)]="form.weight" min="0" /></label>
          <label>Social (SSN)<input type="text" name="ssn" placeholder="123-00-1234" pattern="\d{3}-?\d{2}-?\d{4}" [(ngModel)]="form.ssn" /></label>
          <label>DL/State ID #<input type="text" name="dlStateId" [(ngModel)]="form.dlStateId" /></label>
          <label>Doctor's Name<input type="text" name="doctorName" [(ngModel)]="form.doctorName" /></label>
        </div>
      </div>

      <div class="card">
        <h2 style="font-size:0.95rem; margin:0 0 0.75rem;">Beneficiary</h2>
        <div class="form-grid">
          <label>Beneficiary Relation<input type="text" name="beneficiaryRelation" [(ngModel)]="form.beneficiaryRelation" /></label>
          <label>Beneficiary Name<input type="text" name="beneficiaryName" [(ngModel)]="form.beneficiaryName" /></label>
          <label>Beneficiary DOB<input type="date" name="beneficiaryDob" [(ngModel)]="form.beneficiaryDob" /></label>
        </div>
      </div>

      <div class="card">
        <h2 style="font-size:0.95rem; margin:0 0 0.75rem;">Health</h2>
        <div class="form-grid">
          <label class="full">Health Conditions<textarea rows="2" name="healthConditions" [(ngModel)]="form.healthConditions"></textarea></label>
          <label class="full">Medications<textarea rows="2" name="medications" [(ngModel)]="form.medications"></textarea></label>
        </div>
      </div>

      <div class="card">
        <h2 style="font-size:0.95rem; margin:0 0 0.75rem;">Policy</h2>
        <div class="form-grid">
          <label>Carrier Name<input type="text" name="carrierName" [(ngModel)]="form.carrierName" /></label>
          <label>Plan Type<input type="text" name="planType" [(ngModel)]="form.planType" /></label>
          <label>Coverage Amount<input type="number" name="coverageAmount" [(ngModel)]="form.coverageAmount" min="0" /></label>
          <label>Monthly Premiums<input type="number" name="monthlyPremiums" [(ngModel)]="form.monthlyPremiums" min="0" /></label>
        </div>
      </div>

      <div class="card">
        <h2 style="font-size:0.95rem; margin:0 0 0.75rem;">Billing</h2>
        <div class="form-grid">
          <label>Initial Draft Date<input type="date" name="initialDraftDate" [(ngModel)]="form.initialDraftDate" /></label>
          <label>Future Draft Date<input type="date" name="futureDraftDate" [(ngModel)]="form.futureDraftDate" /></label>
          <label class="full">
            Payer
            <select name="payer" [(ngModel)]="form.payer">
              <option value="" disabled selected>Select</option>
              @for (p of payerOptions; track p.value) {
                <option [value]="p.value">{{ p.label }}</option>
              }
            </select>
          </label>

          @if (form.payer === 'SELF') {
            <label>Bank Name<input type="text" name="bankName" [(ngModel)]="form.bankName" /></label>
            <label>Account Title<input type="text" name="accountTitle" [(ngModel)]="form.accountTitle" /></label>
            <label>
              Account Type
              <select name="accountType" [(ngModel)]="form.accountType">
                <option value="" disabled selected>Select</option>
                @for (a of accountTypeOptions; track a.value) {
                  <option [value]="a.value">{{ a.label }}</option>
                }
              </select>
            </label>
            <label>Routing Number<input type="text" name="routingNumber" maxlength="9" pattern="\d{9}" [(ngModel)]="form.routingNumber" /></label>
            <label>Account Number<input type="text" name="accountNumber" [(ngModel)]="form.accountNumber" /></label>
          }

          @if (form.payer === 'SOMEONE_ELSE') {
            <label>Account Title<input type="text" name="accountTitle" [(ngModel)]="form.accountTitle" /></label>
            <label>Payer's Social<input type="text" name="payerSocial" placeholder="123-00-1234" pattern="\d{3}-?\d{2}-?\d{4}" [(ngModel)]="form.payerSocial" /></label>
            <label>
              Account Type
              <select name="accountType" [(ngModel)]="form.accountType">
                <option value="" disabled selected>Select</option>
                @for (a of accountTypeOptions; track a.value) {
                  <option [value]="a.value">{{ a.label }}</option>
                }
              </select>
            </label>
            <label>Routing Number<input type="text" name="routingNumber" maxlength="9" pattern="\d{9}" [(ngModel)]="form.routingNumber" /></label>
            <label>Account Number<input type="text" name="accountNumber" [(ngModel)]="form.accountNumber" /></label>
          }
        </div>
      </div>

      <div class="card">
        <label class="full">Additional Notes<textarea rows="3" name="closerNotes" [(ngModel)]="form.closerNotes"></textarea></label>
      </div>

      <button class="btn" type="submit" [disabled]="submitting()">{{ submitting() ? 'Submitting...' : 'Submit to admin' }}</button>
    </form>
  }
</div>
